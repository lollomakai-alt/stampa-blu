<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lollo-Stamp Bridge 80mm Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
    background-color: #0a0e17;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container {
    width: 100%;
    max-width: 400px;
}
.header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #1F2937;
    padding-bottom: 15px;
}
.headerTitle {
    font-size: 22px;
    font-weight: bold;
    color: #39FF14;
    letter-spacing: 2px;
}
.card {
    background-color: #111827;
    border: 1px solid #1F2937;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
}
.cardLabel {
    font-size: 11px;
    color: #9CA3AF;
    margin-bottom: 10px;
    letter-spacing: 1px;
    font-weight: bold;
}
.actionButton {
    background-color: #1E3A8A;
    border: 1px solid #3B82F6;
    color: #FFFFFF;
    padding: 15px;
    border-radius: 12px;
    width: 100%;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.2s;
}
.actionButton:hover {
    background-color: #1D4ED8;
}
.logBox {
    background-color: #030712;
    border: 1px solid #1F2937;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 11px;
    color: #39FF14;
    height: 140px;
    overflow-y: auto;
}
.status-badge {
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    background: #030712;
    border: 1px solid #FACC15;
    color: #FACC15;
    font-weight: bold;
    margin-bottom: 10px;
}
.connected {
    border-color: #39FF14 !important;
    color: #39FF14 !important;
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="headerTitle">LOLLO-STAMP</div>
        <div style="font-size: 11px; color: #9CA3AF; margin-top: 4px;">80MM PRO BRIDGE</div>
    </div>
    
    <div class="card">
        <div class="cardLabel">CONNESSIONE STAMPANTE BLUETOOTH</div>
        <div id="statusBadge" class="status-badge">In attesa di associazione Bluetooth...</div>
        <button class="actionButton" onclick="connettiStampante()">Associa Stampante Termica</button>
    </div>
    
    <div class="card">
        <div class="cardLabel">CONSOLE LOG IN TEMPO REALE</div>
        <div id="logBox" class="logBox">[SYSTEM] Interfaccia 80mm avviata. Clicca su associa stampante.</div>
    </div>
</div>

<script>
// --- CONFIGURAZIONE SUPABASE ---
const SUPABASE_URL = 'https://yyrawuynqukwszvotiuu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5pTXjGcknQWzbVDWwD4tSQ_trCjQV0b';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myPrinterDevice = null;
let bluetoothCharacteristic = null;
let isProcessingQueue = false;

// Larghezza massima standard per stampanti 80mm (caratteri font normale)
const LINE_WIDTH_80MM = 42; 

function addLog(msg) {
    const logBox = document.getElementById('logBox');
    if (logBox) {
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }
}

// 1. Gestione Disconnessione Bluetooth
function onDisconnected(event) {
    addLog("ATTENZIONE: Stampante Bluetooth disconnessa.");
    const badge = document.getElementById('statusBadge');
    badge.innerText = "Stampante disconnessa (Riconnessione...)";
    badge.classList.remove('connected');
    bluetoothCharacteristic = null;
    
    // Tentativo di riconnessione automatica al dispositivo salvato se possibile
    if (myPrinterDevice && myPrinterDevice.gatt) {
        setTimeout(async () => {
            try {
                addLog("Tentativo di riconnessione automatica GATT...");
                const server = await myPrinterDevice.gatt.connect();
                await setupCharacteristics(server);
            } catch (err) {
                addLog(`Riconnessione automatica fallita: ${err.message}. Clicca su associa.`);
                badge.innerText = "Disconnesso. Associa manualmente.";
            }
        }, 4000);
    }
}

async function setupCharacteristics(server) {
    addLog("Connessione GATT stabilita. Cerco il servizio di stampa...");
    const services = await server.getPrimaryServices();
    for (const service of services) {
        try {
            const characteristics = await service.getCharacteristics();
            for (const char of characteristics) {
                if (char.properties.write || char.properties.writeWithoutResponse) {
                    bluetoothCharacteristic = char;
                    break;
                }
            }
        } catch (e) {
            console.warn("Servizio ignorato", e);
        }
        if (bluetoothCharacteristic) break;
    }

    if (!bluetoothCharacteristic) {
        throw new Error("Nessuna caratteristica di scrittura compatibile trovata.");
    }

    document.getElementById('statusBadge').innerText = `Connesso a: ${myPrinterDevice.name || 'Stampante'}`;
    document.getElementById('statusBadge').classList.add('connected');
    addLog("Stampante pronta e configurata con successo!");

    processPendingJobs();
}

// 2. Connessione Bluetooth Manuale
async function connettiStampante() {
    if (!navigator.bluetooth) {
        alert("Il Bluetooth non è supportato da questo browser. Usa Google Chrome su Android o Desktop.");
        addLog("ERRORE: Bluetooth Web API non supportata.");
        return;
    }

    try {
        addLog("Apertura ricerca dispositivi Bluetooth...");
        myPrinterDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                '000018f0-0000-1000-8000-00805f9b34fb',
                '49535343-fe7d-4ae5-8fa9-9fafd205e455',
                'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
            ]
        });

        // Rimuoviamo eventuali listener precedenti per evitare duplicati
        myPrinterDevice.removeEventListener('gattserverdisconnected', onDisconnected);
        myPrinterDevice.addEventListener('gattserverdisconnected', onDisconnected);

        addLog(`Dispositivo selezionato: ${myPrinterDevice.name || 'Sconosciuto'}`);

        const server = await myPrinterDevice.gatt.connect();
        addLog("Connessione GATT stabilita. Cerco il servizio di stampa...");

        const services = await server.getPrimaryServices();
        for (const service of services) {
            try {
                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        bluetoothCharacteristic = char;
                        break;
                    }
                }
            } catch (e) {
                console.warn("Servizio ignorato", e);
            }
            if (bluetoothCharacteristic) break;
        }

        if (!bluetoothCharacteristic) {
            throw new Error("Nessuna caratteristica di scrittura compatibile trovata.");
        }

        document.getElementById('statusBadge').innerText = `Connesso a: ${myPrinterDevice.name}`;
        document.getElementById('statusBadge').classList.add('connected');
        addLog("Stampante 80mm pronta e configurata!");

        processPendingJobs();

    } catch (error) {
        console.error(error);
        addLog(`Errore/Annullato: ${error.message}`);
    }
}

// 3. Lettura impostazioni dinamiche da Supabase
async function getDatiImpostazioni() {
    const { data, error } = await supabaseClient.from('settings').select('*');
    let config = {
        nome_locale: "NAKAI TIKI BAR",
        indirizzo_locale: "Via dei Tiki, 1 - Roma",
        piva_locale: "P.IVA: 01234567890"
    };

    if (data && !error) {
        data.forEach(row => {
            const k = row.key || row.chiave;
            const v = row.value || row.valore;

            if (k === 'nome_locale' || k === 'nome') config.nome_locale = v;
            if (k === 'indirizzo_locale' || k === 'indirizzo') config.indirizzo_locale = v;
            if (k === 'piva_locale' || k === 'piva') config.piva_locale = v;
        });
    }
    return config;
}

// Utility per formattare righe con testo a sinistra e prezzo a destra (ottimizzato 80mm)
function formatLine(leftText, rightText) {
    const maxLen = LINE_WIDTH_80MM;
    if (rightText.length >= maxLen) return leftText + "\n" + rightText;
    const spaces = maxLen - leftText.length - rightText.length;
    return leftText + " ".repeat(Math.max(1, spaces)) + rightText + "\n";
}

// 3. Funzione di stampa professionale 80mm
async function sendToPrinter(payloadData) {
    if (!myPrinterDevice || !myPrinterDevice.gatt.connected || !bluetoothCharacteristic) {
        throw new Error("Stampante Bluetooth disconnessa.");
    }

    const ESC = '\x1B';
    const GS = '\x1D';
    const INIT = ESC + '@';
    const ALIGN_CENTER = ESC + 'a' + '\x01';
    const ALIGN_LEFT = ESC + 'a' + '\x00';
    
    // Spaziatura di alimentazione e taglio pulito per evitare che il testo resti sotto la testina
    const FEED_PAPER = '\n'.repeat(4); 
    const CUT = GS + 'V' + '\x41' + '\x03'; 

    let textToPrint = INIT;
    const settings = await getDatiImpostazioni();
    const tipoDoc = (payloadData.type || payloadData.tipo || 'comanda').toLowerCase();
    const separatore = "------------------------------------------\n";
    const separatoreDoppio = "==========================================\n";

    if (tipoDoc === 'conto' || tipoDoc === 'preconto') {
        const nomeLocale = payloadData.nome_locale || settings.nome_locale;
        const indirizzoLocale = payloadData.indirizzo_locale || settings.indirizzo_locale;
        const pivaLocale = payloadData.piva_locale || settings.piva_locale;
        const operatore = payloadData.operatore || payloadData.cameriere || "Sala";
        const idOrdine = payloadData.id_ordine || payloadData.ordine_id || "N/D";

        textToPrint += ALIGN_CENTER;
        textToPrint += GS + '!' + '\x01' + `${nomeLocale}\n` + GS + '!' + '\x00';
        textToPrint += `${indirizzoLocale}\n`;
        textToPrint += `${pivaLocale}\n`;
        textToPrint += separatoreDoppio;
        textToPrint += `*** DOCUMENTO NON FISCALE ***\n`;
        textToPrint += `PRECONTO / CONTO TAVOLO\n`;
        textToPrint += separatoreDoppio;

        const tavolo = payloadData.tavolo || payloadData.table || "N/D";
        const coperti = payloadData.coperti ? `Coperti: ${payloadData.coperti}` : 'Coperti: 1';
        
        textToPrint += ALIGN_LEFT;
        textToPrint += `TAVOLO: ${tavolo} | ${coperti}\n`;
        textToPrint += `CONTO N: #${idOrdine} | OPERATORE: ${operatore}\n`;
        textToPrint += `DATA: ${new Date().toLocaleDateString()} - ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}\n`;
        textToPrint += separatore;
        textToPrint += `ARTICOLI ORDINATI:\n`;
        textToPrint += separatore;

        let totaleCalcolato = 0;

        if (payloadData.items && Array.isArray(payloadData.items)) {
            payloadData.items.forEach(item => {
                const qty = item.qty || 1;
                const name = item.name || item.nome || 'Articolo';
                const prezzoUnitario = item.prezzo || item.price || 0;
                const subtotal = qty * prezzoUnitario;
                totaleCalcolato += subtotal;

                const rigaArticolo = `${qty}x ${name}`;
                const rigaPrezzo = prezzoUnitario > 0 ? `EUR ${subtotal.toFixed(2)}` : '';
                
                textToPrint += formatLine(rigaArticolo, rigaPrezzo);

                if (item.note || item.varianti) {
                    textToPrint += `   -> Note: ${item.note || item.varianti}\n`;
                }
            });
        }

        textToPrint += separatoreDoppio;
        const totaleFinale = payloadData.totale || payloadData.total || totaleCalcolato;
        
        textToPrint += ALIGN_CENTER + GS + '!' + '\x01';
        textToPrint += `TOTALE: EUR ${Number(totaleFinale).toFixed(2)}\n`;
        textToPrint += GS + '!' + '\x00';
        textToPrint += separatoreDoppio;
        textToPrint += `Grazie per aver scelto il nostro locale!\n`;
        textToPrint += `Il personale vi augura una buona serata\n`;
        textToPrint += FEED_PAPER + CUT;

    } else {
        // --- COMANDA CUCINA / BAR 80mm ---
        const tipoComanda = (payloadData.type || 'COMANDA').toUpperCase();
        const nomeTavolo = payloadData.table || payloadData.tavolo || 'Tavolo';
        const numCoperti = payloadData.coperti || payloadData.seats || '-';
        const now = new Date();

        const generaPaginaComanda = (articoliSlice, numeroPagina, totalePagine) => {
            let paginaStr = ALIGN_CENTER + GS + '!' + '\x11'; // Carattere grande in evidenza per cucina
            paginaStr += `*** ${tipoComanda} ***\n`;
            if (totalePagine > 1) {
                paginaStr += GS + '!' + '\x00' + `(Pag. ${numeroPagina} di ${totalePagine})\n`;
                paginaStr += GS + '!' + '\x11';
            }
            paginaStr += `\nTAVOLO: ${nomeTavolo}\n`;
            paginaStr += GS + '!' + '\x00'; // Ritorno a font normale
            paginaStr += separatore;
            paginaStr += `COPERTI: ${numCoperti} | ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}\n`;
            paginaStr += separatoreDoppio + '\n';

            articoliSlice.forEach(item => {
                const qty = item.qty || 1;
                const name = (item.name || item.nome || 'Generico').toUpperCase();
                const nota = item.note || item.varianti ? item.note || item.varianti : '';

                paginaStr += ALIGN_LEFT + GS + '!' + '\x01'; // Evidenziato medio
                paginaStr += `[ ${qty} ]  ${name}\n`;
                paginaStr += GS + '!' + '\x00'; // Font normale
                
                if (nota) {
                    paginaStr += `     NOTE: >> ${nota.toUpperCase()} <<\n`;
                }
                paginaStr += separatore;
            });

            paginaStr += `\n[ FINE COMANDA ]\n`;
            paginaStr += FEED_PAPER + CUT;
            return paginaStr;
        };

        if (payloadData.items && Array.isArray(payloadData.items) && payloadData.items.length > 0) {
            const CHUNK_LIMIT = 6; // Ottimizzato per fogli da 80mm
            const items = payloadData.items;
            const totalePagine = Math.ceil(items.length / CHUNK_LIMIT);

            for (let p = 0; p < totalePagine; p++) {
                const sliceArticoli = items.slice(p * CHUNK_LIMIT, (p + 1) * CHUNK_LIMIT);
                textToPrint += generaPaginaComanda(sliceArticoli, p + 1, totalePagine);
            }
        } else {
            textToPrint += ALIGN_CENTER + GS + '!' + '\x11';
            textToPrint += `*** ${tipoComanda} ***\n\nTAVOLO: ${nomeTavolo}\n`;
            textToPrint += GS + '!' + '\x00';
            textToPrint += separatore;
            textToPrint += `Nessun articolo specificato\n`;
            textToPrint += separatoreDoppio;
            textToPrint += FEED_PAPER + CUT;
        }
    }

    const encoder = new TextEncoder();
    const data = encoder.encode(textToPrint);

    // CHUNK_SIZE ridotto a 128 byte per maggiore stabilità su stampanti termiche economiche BLE
    const CHUNK_SIZE = 128;
    for (let i = 0; i < data.length; i += CHUNK_SIZE) {
        const chunk = data.slice(i, i + CHUNK_SIZE);
        if (bluetoothCharacteristic.properties.writeWithoutResponse) {
            await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
        } else {
            await bluetoothCharacteristic.writeValue(chunk);
        }
        // Breve pausa per evitare il sovraccarico del buffer della stampante
        await new Promise(resolve => setTimeout(resolve, 20));
    }
}

// 5. Elaborazione della coda protetta da lock (evita esecuzioni multiple concorrenti)
async function processPendingJobs() {
    if (isProcessingQueue) return;
    if (!myPrinterDevice || !myPrinterDevice.gatt || !myPrinterDevice.gatt.connected) {
        return;
    }

    isProcessingQueue = true;

    try {
        const { data: pendingJobs, error } = await supabaseClient
            .from('print_jobs')
            .select('*')
            .eq('status', 'nuovo')
            .order('id', { ascending: true });

        if (error) {
            addLog(`Errore lettura DB: ${error.message}`);
            isProcessingQueue = false;
            return;
        }

        if (pendingJobs && pendingJobs.length > 0) {
            addLog(`Trovati ${pendingJobs.length} ordini da stampare.`);

            for (const job of pendingJobs) {
                try {
                    addLog(`Invio in stampa ordine ID: ${job.id}...`);
                    await sendToPrinter(job.payload);

                    const { error: updateError } = await supabaseClient
                        .from('print_jobs')
                        .update({ status: 'stampato' })
                        .eq('id', job.id);

                    if (updateError) {
                        addLog(`Errore aggiornamento stato ID ${job.id}: ${updateError.message}`);
                        break;
                    } else {
                        addLog(`Ordine ID ${job.id} stampato e aggiornato con successo!`);
                    }
                } catch (err) {
                    addLog(`Errore di stampa su ID ${job.id}: ${err.message}. Interrompo la coda.`);
                    break;
                }
            }
        }
    } catch (e) {
        console.error(e);
    } finally {
        isProcessingQueue = false;
    }
}

// 6. Ascolto in tempo reale e polling di sicurezza
if (supabaseClient) {
    supabaseClient
        .channel('public:print_jobs')
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'print_jobs'
        }, async (payload) => {
            if (payload.new && payload.new.status === 'nuovo') {
                addLog(`Nuovo ordine ricevuto in tempo reale! ID: ${payload.new.id}`);
                await processPendingJobs();
            }
        })
        .subscribe((status) => {
            addLog(`Canale Realtime Supabase: ${status}`);
        });
}

setInterval(() => {
    if (myPrinterDevice && myPrinterDevice.gatt && myPrinterDevice.gatt.connected) {
        processPendingJobs();
    }
}, 30000);
</script>

</body>
</html>
