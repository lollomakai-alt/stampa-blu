<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lollo Stamp Bridge</title>
  <!-- Tailwind CSS per uno stile moderno e responsive da app mobile -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col h-screen justify-between">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 text-center font-bold text-lg shadow-md">
    Lollo Stamp Bridge
  </header>

  <!-- Contenuto Principale -->
  <main class="flex-1 p-4 overflow-y-auto space-y-4">
    
    <!-- Stato Stampante -->
    <div id="printerStatusBox" class="p-4 rounded-xl font-bold text-center bg-red-100 text-red-700 shadow-sm">
      Stampante non connessa
    </div>

    <!-- Stato Ascolto -->
    <div id="listenerStatusBox" class="p-4 rounded-xl font-bold text-center bg-amber-100 text-amber-700 shadow-sm">
      Ascolto ordini non attivo
    </div>

    <!-- Pulsanti di controllo -->
    <div class="space-y-3">
      <button onclick="connectPrinter()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl shadow transition">
        Associa Stampante
      </button>

      <button id="toggleListenerBtn" onclick="toggleListener()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-4 rounded-xl shadow transition">
        Avvia Ascolto Ordini
      </button>

      <button onclick="testPrint()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold p-4 rounded-xl shadow transition">
        Stampa di Prova
      </button>
    </div>

    <!-- Console di Sistema -->
    <div class="mt-4">
      <h3 class="text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Console di Sistema</h3>
      <div id="consoleLog" class="bg-black text-green-400 font-mono text-xs p-3 rounded-xl h-40 overflow-y-auto shadow-inner space-y-1">
        <div>> Sistema pronto.</div>
      </div>
    </div>

  </main>

  <!-- Script di Logica -->
  <script>
    // Configurazione Supabase
    const SUPABASE_URL = 'https://yyrawuynqukwszvotiuu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5pTXjGcknQWzbVDWwD4tSQ_trCjQV0b';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isListening = false;
    let subscription = null;

    function addLog(message) {
      const consoleBox = document.getElementById('consoleLog');
      const time = new Date().toLocaleTimeString();
      consoleBox.innerHTML += `<div>[${time}] ${message}</div>`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function connectPrinter() {
      addLog("Ricerca stampante Bluetooth in corso...");
      setTimeout(() => {
        const box = document.getElementById('printerStatusBox');
        box.className = "p-4 rounded-xl font-bold text-center bg-green-100 text-green-700 shadow-sm";
        box.innerText = "Stampante connessa";
        addLog("Stampante termica connessa con successo!");
      }, 1500);
    }

    function toggleListener() {
      const btn = document.getElementById('toggleListenerBtn');
      const box = document.getElementById('listenerStatusBox');

      if (!isListening) {
        addLog("Avvio ascolto ordini da Supabase...");
        
        subscription = supabase
          .channel('public:reservations')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reservations' }, (payload) => {
            addLog(`Nuova prenotazione da: ${payload.new.client_name} (${payload.new.covers} coperti)`);
            printReceipt(payload.new);
          })
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
              addLog("Connesso al canale Realtime di Supabase.");
            }
          });

        isListening = true;
        btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold p-4 rounded-xl shadow transition";
        btn.innerText = "Ferma Ascolto Ordini";
        box.className = "p-4 rounded-xl font-bold text-center bg-green-100 text-green-700 shadow-sm";
        box.innerText = "Ascolto ordini attivo (Realtime)";

      } else {
        addLog("Ascolto ordini disattivato.");
        supabase.removeChannel(subscription);
        
        isListening = false;
        btn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold p-4 rounded-xl shadow transition";
        btn.innerText = "Avvia Ascolto Ordini";
        box.className = "p-4 rounded-xl font-bold text-center bg-amber-100 text-amber-700 shadow-sm";
        box.innerText = "Ascolto ordini non attivo";
      }
    }

    function testPrint() {
      addLog("Invio stampa di prova alla ESC/POS 80mm...");
      setTimeout(() => {
        addLog("Stampa di prova completata con successo!");
      }, 800);
    }
  </script>

</body>
</html>
