<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lollo-Stamp Bridge</title>
    <style>
        body {
            background-color: #0a0e17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1F2937;
            padding-bottom: 15px;
        }
        .headerTitle {
            font-size: 22px;
            font-weight: bold;
            color: #39FF14;
            letter-spacing: 2px;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1F2937;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .cardLabel {
            font-size: 11px;
            color: #9CA3AF;
            margin-bottom: 10px;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .actionButton {
            background-color: #1E3A8A;
            border: 1px solid #3B82F6;
            color: #FFFFFF;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .logBox {
            background-color: #030712;
            border: 1px solid #1F2937;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #39FF14;
            height: 120px;
            overflow-y: auto;
        }
        .status-badge {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: #030712;
            border: 1px solid #FACC15;
            color: #FACC15;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .connected {
            border-color: #39FF14 !important;
            color: #39FF14 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="headerTitle">LOLLO-STAMP</div>
        <div style="font-size: 11px; color: #9CA3AF; margin-top: 4px;">CLOUD DIRECT BRIDGE</div>
    </div>

    <div class="card">
        <div class="cardLabel">CONNESSIONE STAMPANTE BLUETOOTH</div>
        <div id="statusBadge" class="status-badge">In attesa di associazione Bluetooth...</div>
        <button class="actionButton" onclick="connettiStampante()">Associa Stampante Termica</button>
    </div>

    <div class="card">
        <div class="cardLabel">CONSOLE LOG IN TEMPO REALE</div>
        <div id="logBox" class="logBox">[SYSTEM] Interfaccia avviata. Clicca su associa stampante.</div>
    </div>
</div>

<script>
    function addLog(msg) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function connettiStampante() {
        if (!navigator.bluetooth) {
            alert("Il Bluetooth non è supportato da questo browser. Usa Google Chrome su Android.");
            addLog("ERRORE: Bluetooth Web API non supportata.");
            return;
        }

        try {
            addLog("Apertura ricerca dispositivi Bluetooth...");
            
            // Richiede la connessione alla stampante (filtra per nome o accetta tutto)
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                // Se vuoi filtrare solo le stampanti, puoi usare: filters: [{ namePrefix: 'POS' }]
            });

            addLog(`Dispositivo selezionato: ${device.name}`);
            document.getElementById('statusBadge').innerText = `Connesso a: ${device.name}`;
            document.getElementById('statusBadge').classList.add('connected');

            const server = await device.gatt.connect();
            addLog("Connessione GATT stabilita con successo!");

        } catch (error) {
            console.error(error);
            addLog(`Errore/Annullato: ${error.message}`);
        }
    }
</script>

</body>
</html>
