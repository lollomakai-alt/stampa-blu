<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOLLO-STAMP 80MM PRO BRIDGE</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #60a5fa;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--danger);
            box-shadow: 0 0 8px var(--danger);
            transition: all 0.3s ease;
        }
        .indicator.connected {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-success {
            background-color: var(--success);
        }
        .console-container {
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .log-entry {
            word-break: break-all;
        }
        .log-sys { color: #38bdf8; }
        .log-ok { color: #4ade80; }
        .log-err { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LOLLO-STAMP</h1>
            <div class="subtitle">80MM PRO BRIDGE</div>
        </header>

        <div class="card">
            <div class="status-box">
                <div id="btIndicator" class="indicator"></div>
                <span id="btStatusText">In attesa di associazione Bluetooth...</span>
            </div>
            
            <button id="btnConnect" class="btn">Associa Stampante Termica</button>
            <button id="btnTest" class="btn btn-success" style="display: none;">Stampa Test 80mm</button>
        </div>

        <div class="card">
            <h3 style="margin: 0; font-size: 1rem; color: var(--text-muted);">CONSOLE LOG IN TEMPO REALE</h3>
            <div id="consoleLog" class="console-container">
                <div class="log-entry log-sys">[SYSTEM] Interfaccia 80mm avviata. Clicca su associa stampante.</div>
            </div>
        </div>
    </div>

    <script>
        const btnConnect = document.getElementById('btnConnect');
        const btnTest = document.getElementById('btnTest');
        const btIndicator = document.getElementById('btIndicator');
        const btStatusText = document.getElementById('btStatusText');
        const consoleLog = document.getElementById('consoleLog');

        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        function log(message, type = 'sys') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-entry log-${type}`;
            div.textContent = `[${timestamp}] ${message}`;
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        btnConnect.addEventListener('click', async () => {
            try {
                log('Ricerca dispositivi Bluetooth in corso...', 'sys');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
                });

                log(`Dispositivo selezionato: ${bluetoothDevice.name || 'Senza nome'}`, 'sys');
                
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                log('Connesso al server GATT', 'ok');

                // Ricerca servizi e caratteristiche standard per stampanti termiche ESC/POS
                const services = await server.getPrimaryServices();
                let found = false;

                for (const service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (const char of characteristics) {
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            bluetoothCharacteristic = char;
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }

                if (!bluetoothCharacteristic) {
                    throw new Error('Nessuna caratteristica di scrittura compatibile trovata.');
                }

                // Aggiornamento UI connessione riuscita
                btIndicator.classList.add('connected');
                btStatusText.textContent = `Connesso: ${bluetoothDevice.name || 'Stampante Termica'}`;
                btnConnect.textContent = 'Disconnetti';
                btnConnect.style.backgroundColor = '#dc2626';
                btnTest.style.display = 'block';
                log('Stampante termica pronta all\'uso (80mm).', 'ok');

            } catch (error) {
                log(`Errore Bluetooth: ${error.message}`, 'err');
                resetConnectionUI();
            }
        });

        function onDisconnected() {
            log('Dispositivo disconnesso.', 'err');
            resetConnectionUI();
        }

        function resetConnectionUI() {
            btIndicator.classList.remove('connected');
            btStatusText.textContent = 'In attesa di associazione Bluetooth...';
            btnConnect.textContent = 'Associa Stampante Termica';
            btnConnect.style.backgroundColor = '';
            btnTest.style.display = 'none';
            bluetoothDevice = null;
            bluetoothCharacteristic = null;
        }

        btnTest.addEventListener('click', async () => {
            if (!bluetoothCharacteristic) {
                log('Errore: Stampante non connessa.', 'err');
                return;
            }

            try {
                log('Invio scontrino di test (80mm)...', 'sys');
                
                // Comandi ESC/POS di base (Inizializzazione, Allineamento Centro, Testo, Taglio)
                const encoder = new TextEncoder();
                const commands = new Uint8Array([
                    0x1B, 0x40, // Inizializza stampante
                    0x1B, 0x61, 0x01, // Allineamento Centrato
                    0x1B, 0x21, 0x30, // Doppia altezza e larghezza
                    ...encoder.encode('LOLLO-STAMP\n'),
                    0x1B, 0x21, 0x00, // Reset font
                    ...encoder.encode('80MM PRO BRIDGE\n'),
                    '--------------------------------\n',
                    0x1B, 0x61, 0x00, // Allineamento Sinistra
                    ...encoder.encode('Stato: CONNESSO OK\n'),
                    ...encoder.encode(`Data: ${new Date().toLocaleString()}\n`),
                    '--------------------------------\n',
                    ...encoder.encode('Test completato con successo!\n\n\n\n'),
                    0x1D, 0x56, 0x41, 0x03 // Taglio carta
                ]);

                await bluetoothCharacteristic.writeValue(commands);
                log('Strip di test inviata con successo!', 'ok');

            } catch (error) {
                log(`Errore durante la stampa: ${error.message}`, 'err');
            }
        });
    </script>
</body>
</html>
